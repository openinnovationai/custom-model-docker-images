[project]
name = "openai-privacy-filter-server"
version = "0.1.0"
description = "GPU-backed HTTP service for OpenAI Privacy Filter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3",
    "torch==2.13.0",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
# Keep the transitive security updates when refreshing the lock.
constraint-dependencies = [
    "certifi>=2026.10.23",
    "filelock>=4.2.10",
    "httpcore2>=2.16.0",
    "httpx2>=2.16.0",
    "setuptools>=84.2.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

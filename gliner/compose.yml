services:
    gliner-serve:
        image: gliner-serve:amd64
        platform: linux/amd64
        build:
            context: .
            dockerfile: gliner/serve/Containerfile
            args:
                GLINER_MODEL: ${GLINER_MODEL:-urchade/gliner_small-v2.1}
            platforms:
                - linux/amd64
        ports:
            - "8080:8080"
        environment:
            - GLINER_DEVICE=cuda
            - GLINER_DTYPE=bfloat16
            - GLINER_MAX_BATCH_SIZE=32
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

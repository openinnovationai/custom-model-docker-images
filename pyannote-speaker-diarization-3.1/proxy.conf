server {
    listen 8080;
    # Allow very large audio uploads and long processing
    client_max_body_size 2048m;
    client_body_timeout 600s;
    send_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;

    # Liveness
    location / {
        proxy_redirect off;
 
        rewrite ^/$ /health-check break;
 
        proxy_pass http://127.0.0.1:8081;
    }
 
    location ~ ^/v1/models/model:predict$  {
        proxy_redirect off;
 
        rewrite ^/v1/models/model:predict$  /diarize break;
        proxy_pass http://127.0.0.1:8081;
    }
 
    # New base path: /v1/audio/diarization
    location ^~ /v1/audio/diarization/ {
        proxy_redirect off;
        client_max_body_size 2048m;
        client_body_timeout 600s;
        send_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;

        # Health at the base
        rewrite ^/v1/audio/diarization/?$ /health-check break;

        # Predict alias
        rewrite ^/v1/audio/diarization/(predict|diarize)$ /diarize break;

        proxy_pass http://127.0.0.1:8081;
    }

    # Handle exact base without trailing slash (support POST without redirect)
    location = /v1/audio/diarization {
        proxy_redirect off;
        client_max_body_size 2048m;
        client_body_timeout 600s;
        send_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        rewrite ^/v1/audio/diarization$ /diarize break;
        proxy_pass http://127.0.0.1:8081;
    }

}
[project]
name = "model-server"
version = "0.1.0"
description = "EngineFabric custom-image model server (template)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "huggingface-hub==0.30.2",
    "transformers==4.51.3",
    "torch==2.7.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.uv]
package = false

# CPU wheels. For NVIDIA images switch the URL to the CUDA build that matches
# the base image (e.g. https://download.pytorch.org/whl/cu128) and re-run `uv lock`.
# CUDA indexes have no macOS wheels, so for GPU images restrict them to Linux to
# keep `make test` working on a Mac:
#   torch = [{ index = "pytorch", marker = "sys_platform == 'linux'" }]
[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
